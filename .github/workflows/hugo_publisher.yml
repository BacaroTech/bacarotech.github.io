name: Build and deploy site

# Pattern consigliato per Pages: una sola coda "pages", senza annullare
# un deploy già in corso.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

env:
  HUGO_VERSION: "0.165.0"
  # Le date dei post sono in ora italiana: build e cutoff dei contenuti futuri
  # devono usare lo stesso fuso.
  TZ: Europe/Rome

jobs:
  build:
    name: Build con Hugo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # bootstrap è montato da node_modules in hugo.toml: le dipendenze npm
      # servono al build anche se nessuno script Node viene eseguito.
      - name: Installa le dipendenze npm
        run: npm ci

      - name: Installa Hugo ${{ env.HUGO_VERSION }}
        run: |
          curl -sSL -o "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v4.0.0

      - name: Cache dei moduli Hugo e delle risorse generate
        uses: actions/cache@v5.0.1
        with:
          path: |
            ~/.cache/hugo_cache
            resources/_gen
          key: hugo-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'hugo.toml', 'package-lock.json', 'assets/**', 'data/**') }}
          restore-keys: |
            hugo-${{ runner.os }}-

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo mod get
          hugo --gc --minify

      - name: Upload dell'artifact per Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: ./public

  deploy:
    name: Deploy su GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4.0.5
